name: Telegram maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: telegram-maintenance
  cancel-in-progress: false
jobs:
  tick:
    if: vars.TELEGRAM_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tgcloud init
      - run: npm run maintenance
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
